# 项目约定：不引入 AndroidX，阶段 0 只用 Android framework API，保持包体轻量。
android.useAndroidX=true
android.nonTransitiveRClass=true

# 工程路径含中文（D:\deepseek项目\壁纸CODE）。AGP 默认直接拒绝构建，
# 这里显式跳过路径检查：本项目已验证 aapt2 / kotlinc / d8 在 UTF-8 路径下可正常工作。
android.overridePathCheck=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 受限环境（以及部分容器）里 Gradle 的原生文件监视会失败：
# "Couldn't open current thread, error = 5"。关掉它，改用轮询/增量快照。
org.gradle.vfs.watch=false

# Kotlin 编译走进程内策略，避免额外 fork 守护进程。
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
# 增量编译的 .alive 标记文件在受限环境里会被拒（AccessDenied），关掉更稳
